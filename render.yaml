services:
  - type: web
    name: gyanaegis
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        fromService:
          name: gyanaegis
          type: web
          envVarKey: RENDER_EXTERNAL_URL
